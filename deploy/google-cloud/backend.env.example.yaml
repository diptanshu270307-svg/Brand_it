# Non-secret Cloud Run settings. Copy to backend.generated.yaml and replace project URLs.
# DATABASE_URL, SECRET_KEY, DEMO_PASSWORD and provider/mail keys come from Secret Manager.
APP_MODE: "production"
AUTO_MIGRATE: "false"
SEED_ON_STARTUP: "false"
DEMO_PASSWORD: "disabled-in-production"
SESSION_COOKIE_NAME: "__session"
PUBLIC_BASE_URL: "https://YOUR_FIREBASE_PROJECT_ID.web.app"
CORS_ORIGINS: "https://YOUR_FIREBASE_PROJECT_ID.web.app,https://YOUR_FIREBASE_PROJECT_ID.firebaseapp.com"
THROTTLING_BACKEND: "database"
TRUSTED_PROXIES: "127.0.0.1,::1"
DOCUMENT_STORAGE_DIR: "/mnt/documents"
LLM_PROVIDER: "gemini"
LLM_MODEL: "CONFIGURE_A_SUPPORTED_GEMINI_MODEL"
LLM_TIMEOUT_SECONDS: "15"
JOB_MAX_RETRIES: "0"
SESSION_CLEANUP_ENABLED: "true"
MAIL_PROVIDER: "none"
# Configure SMTP before relying on invitations or password recovery:
# MAIL_PROVIDER: "smtp"
# SMTP_HOST: "smtp.your-provider.example"
# SMTP_PORT: "587"
# SMTP_FROM: "BrandLint <security@your-domain.example>"
# SMTP_STARTTLS: "true"
# SMTP_USERNAME / SMTP_PASSWORD: inject from Secret Manager, not this file.
