services:
  - type: web
    name: brandlint
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_MODE
        value: isolated-demo
      - key: DATABASE_URL
        value: sqlite:///./brandlint.db
      - key: AUTO_MIGRATE
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LLM_PROVIDER
        value: mock
      - key: SESSION_COOKIE_NAME
        value: "brandlint_session"
      - key: DEV_COOKIE_SECURE
        value: "true"
