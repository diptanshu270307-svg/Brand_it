# BrandLint Production Nginx Reverse Proxy Configuration
# Provides TLS termination, HTTP/2, HSTS, cookie isolation, and client IP preservation.

# Upstream FastAPI / Uvicorn server
upstream brandlint_backend {
    server backend:8000;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name brandlint.example.com;

    # ACME challenge path for Let's Encrypt certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block with TLS Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brandlint.example.com;

    # SSL / TLS Certificates
    ssl_certificate /etc/letsencrypt/live/brandlint.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brandlint.example.com/privkey.pem;

    # Modern TLS Security Configuration (Mozilla Intermediate guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BrandLintSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    # HSTS: Informs browsers to only use HTTPS, enabling __Host- cookie acceptance
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload size limit for guideline PDFs and documents (25 MB)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Assets Caching (Fingerprinted assets from Vite /assets/)
    location /assets/ {
        proxy_pass http://brandlint_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Aggressive caching for hashed Vite static assets
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Application and API Reverse Proxy
    location / {
        proxy_pass http://brandlint_backend;
        proxy_http_version 1.1;

        # WebSocket / Connection upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client identity and scheme to FastAPI ProxyHeadersMiddleware
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cookie and authorization pass-through
        proxy_pass_header Set-Cookie;
        proxy_pass_header Cookie;
        proxy_pass_header Authorization;

        # Timeouts for longer model evaluation jobs
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
