services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brandlint
      POSTGRES_PASSWORD: brandlint
      POSTGRES_DB: brandlint
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandlint -d brandlint"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://brandlint:brandlint@db:5432/brandlint
      SECRET_KEY: docker-demo-secret-change-in-production
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
