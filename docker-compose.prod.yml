services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brandlint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-brandlint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brandlint} -d ${POSTGRES_DB:-brandlint}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_MODE: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-brandlint}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brandlint}
      SECRET_KEY: ${SECRET_KEY:?Strong SECRET_KEY required (at least 32 characters)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL (https://...) required}
      SEED_ON_STARTUP: "false"

      # Trusted Reverse Proxy Network
      TRUSTED_PROXIES: "reverse-proxy,127.0.0.1,172.16.0.0/12,10.0.0.0/8"

      # Production SMTP Mail Delivery Configuration
      MAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM required}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}

      # AI Provider
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  reverse-proxy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required (e.g. brandlint.company.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required for TLS certificate notifications}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
