name: BrandLint CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests & Evaluation (PostgreSQL 16 + SQLite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brandlint
          POSTGRES_PASSWORD: brandlint
          POSTGRES_DB: brandlint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest suite (SQLite)
        working-directory: backend
        run: pytest -q

      - name: Verify seed & 18-draft benchmark on PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://brandlint:brandlint@localhost:5432/brandlint_test
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes
          LLM_PROVIDER: mock
        run: |
          PYTHONPATH=backend python -m app.seed --reset
          python scripts/evaluate.py

  frontend-build:
    name: Frontend Typecheck & Build (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
